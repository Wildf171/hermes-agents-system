apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: neo-curriculos-hpa
  namespace: default
  labels:
    app: neo-curriculos
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: neo-curriculos-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  - type: Pods
    pods:
      metric:
        name: http_requests_per_second
      target:
        type: AverageValue
        averageValue: 100
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 2
        periodSeconds: 30
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
      selectPolicy: Min
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: neo-curriculos-pdb
  namespace: default
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: neo-curriculos
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: neo-curriculos-mongodb-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: neo-curriculos-mongodb
  minReplicas: 3
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
