[pytest]
# ============================================================================
# pytest.ini - Configuração pytest
# ============================================================================

# Diretório de testes
testpaths = tests

# Python files
python_files = test_*.py *_test.py

# Test classes
python_classes = Test* *Tests

# Test functions
python_functions = test_*

# Markers
markers =
    e2e: end-to-end tests
    seguranca: security tests (OWASP)
    load: load/performance tests
    smoke: smoke tests (health checks)
    slow: tests that take a long time
    unit: unit tests
    integration: integration tests
    lgpd: LGPD compliance tests

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
log_file = pytest.log
log_file_level = DEBUG

# Coverage
addopts =
    --cov=
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    --strict-markers
    --tb=short
    -v

# Minimum Python version
minversion = 3.11

# Timeout para testes (em segundos)
timeout = 300

# Parallel execution (se usar pytest-xdist)
# addopts = -n auto

# Doctest
# addopts = --doctest-modules

# ============================================================================
# ENVIRONMENT
# ============================================================================

# Set environment variables
env =
    FLASK_ENV=testing
    JWT_SECRET_KEY=test-secret-key-min-32-chars

# ============================================================================
# FILTERWARNINGS
# ============================================================================

# Ignore warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::FutureWarning

# ============================================================================
# EXECUTION OPTIONS
# ============================================================================

# Stop on first failure
# addopts = -x

# Show print statements
# addopts = -s

# Show 10 slowest tests
# addopts = --durations=10

# Run specific test
# pytest tests/10_TESTES_E2E.py::TestFluxoAutenticacao::test_registrar_candidato_sucesso -v

# Run specific marker
# pytest -m "e2e" -v
# pytest -m "smoke" -v
# pytest -m "not slow" -v

# Parallel execution (requires pytest-xdist)
# pytest -n auto

# ============================================================================
# EXAMPLES
# ============================================================================

# Run all tests
# pytest

# Run only E2E tests
# pytest -m e2e

# Run with coverage
# pytest --cov --cov-report=html

# Run specific test class
# pytest tests/10_TESTES_E2E.py::TestFluxoAutenticacao

# Run specific test function
# pytest tests/10_TESTES_E2E.py::TestFluxoAutenticacao::test_registrar_candidato_sucesso

# Run with verbose output
# pytest -v

# Run and stop on first failure
# pytest -x

# Run and show print statements
# pytest -s

# Run with custom base URL
# pytest --base-url=http://staging-server.com:5000

# ============================================================================
# MARKERS
# ============================================================================

