[pytest]
# Configuração do Pytest para Neo Currículos Backend

# Diretórios de teste
testpaths = tests

# Padrão de nome de arquivo de teste
python_files = test_*.py conftest.py

# Padrão de função de teste
python_functions = test_*

# Padrão de classe de teste
python_classes = Test*

# Adicionar opções padrão
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes
    --timeout=30

# Markers customizados
markers =
    auth: Testes de autenticação e JWT
    upload: Testes de upload de currículo
    lgpd: Testes de conformidade LGPD
    busca: Testes de busca e filtros
    seguranca: Testes de segurança
    slow: Testes lentos
    integration: Testes de integração
    unit: Testes unitários

# Cobertura
[coverage:run]
source = .
omit =
    */tests/*
    */venv/*
    setup.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod

precision = 2
